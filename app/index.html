<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidix AI | Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='5' width='18' height='14' rx='3'/%3E%3Cpath d='M10 9.5v5l4.5-2.5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#fff;--ink:#14213D;--blue:#2563EB;--blue-d:#1D4ED8;--panel:#F5F8FF;--line:#DCE3F0;--line2:#B9CBF5;--muted:#4B5B78;--ok:#14602F;--bad:#B04A4A}
*{box-sizing:border-box}
body{margin:0;background:var(--panel);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5}
a{color:var(--blue-d);text-decoration:none}
button,input,textarea,select{font-family:inherit;font-size:15px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:'Newsreader',Georgia,serif;font-weight:500;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(30px,4vw,44px);line-height:1.1}h2{font-size:26px}h3{font-size:20px}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:8px;border:1px solid transparent;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}
.btn:hover{background:var(--blue-d)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line2)}.btn.ghost:hover{background:var(--panel)}
.btn.big{min-height:56px;font-size:17px;padding:0 32px}.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
.chip{min-height:40px;padding:0 16px;border:1px solid var(--line2);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}.chip:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=email],input[type=password],input[type=number],textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:12px 14px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:130px;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.msg{font-size:14px;min-height:20px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
/* shell */
#shell{display:flex;min-height:100vh}
#side{width:236px;flex:0 0 236px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
#side .logo{display:flex;align-items:center;gap:10px;font-family:'Newsreader',serif;font-weight:600;font-size:24px;padding:0 8px 16px;color:var(--ink)}
#side a.nav{display:flex;align-items:center;min-height:42px;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:500}
#side a.nav:hover{background:var(--panel);color:var(--ink)}
#side a.nav.on{background:#E4EDFF;color:var(--blue-d);font-weight:600}
#main{flex:1;min-width:0;padding:32px clamp(16px,4vw,48px) 64px;max-width:1100px}
.usage{margin-top:auto;font-size:13px;color:var(--muted);padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.bar{height:6px;background:#E4EDFF;border-radius:3px;margin-top:8px}.bar i{display:block;height:6px;background:var(--blue);border-radius:3px}
@media(max-width:820px){#shell{flex-direction:column}#side{width:100%;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line);align-items:center}#side .logo{padding:0 8px;font-size:20px}#side a.nav{white-space:nowrap;flex:none}.usage{display:none}}
/* auth */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#auth .card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;padding:32px}
/* results */
.grid{display:grid;gap:16px}.two{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.scene{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.scene:first-child{border-top:0}
.kv{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:14px;padding:3px 0}
.prompt{background:var(--ink);color:#E6ECFA;border-radius:10px;padding:16px;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.65;white-space:pre-wrap}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spin{width:18px;height:18px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;margin-right:10px}
@keyframes sp{to{transform:rotate(360deg)}}
.note{background:#FFF2D6;border:1px solid #F0D9A6;color:#7A4A00;border-radius:10px;padding:12px 14px;font-size:14px}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style>
</head>
<body>
<div id="boot" style="padding:40px;text-align:center;color:var(--muted)">Loading...</div>
<div id="auth" hidden></div>
<div id="shell" hidden>
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var sb, cfg, me = null, mode = 'login';
  var OPT = {
    style: ['3D Animation', 'Photorealistic', 'Anime', 'Cinematic', 'Product Commercial', 'UGC'],
    aspect: ['9:16', '16:9', '1:1'],
    mood: ['Suspenseful', 'Funny', 'Emotional', 'Inspirational', 'Dramatic', 'Luxury'],
    audio: ['Dialogue Only', 'Voiceover', 'No Dialogue', 'Dialogue With Music'],
    detail: ['standard', 'detailed', 'advanced']
  };
  var form = { idea: '', style: 'Cinematic', duration: 30, custom: false, aspect: '9:16', mood: 'Dramatic', audio: 'Dialogue With Music', detail: 'standard', generator: 'Higgsfield' };

  /* ---------- API ---------- */
  function token() { return sb.auth.getSession().then(function (r) { return r.data.session && r.data.session.access_token; }); }
  function api(path, body) {
    return token().then(function (t) {
      return fetch('/api/' + path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t }, body: body ? JSON.stringify(body) : undefined });
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Something went wrong.'); e.status = r.status; throw e; } return j; }); });
  }
  function refreshMe() { return api('me').then(function (m) { me = m; renderSide(); return m; }); }

  /* ---------- boot ---------- */
  fetch('/api/config').then(function (r) { return r.json(); }).then(function (c) {
    cfg = c;
    if (!c.supabaseUrl || !c.supabaseAnonKey) { $('#boot').textContent = 'The app is not configured yet (missing Supabase settings).'; return; }
    sb = window.supabase.createClient(c.supabaseUrl, c.supabaseAnonKey);
    sb.auth.onAuthStateChange(function () { start(); });
    start();
  }).catch(function () { $('#boot').textContent = 'Could not load the app. Please refresh.'; });

  var started = false;
  function start() {
    sb.auth.getSession().then(function (r) {
      $('#boot').hidden = true;
      if (!r.data.session) { me = null; $('#shell').hidden = true; $('#auth').hidden = false; renderAuth(); return; }
      $('#auth').hidden = true; $('#shell').hidden = false;
      refreshMe().then(route).catch(function (e) { $('#main').innerHTML = '<div class="note">' + esc(e.message) + '</div>'; });
    });
  }

  /* ---------- auth ---------- */
  function renderAuth(msg, ok) {
    var su = mode === 'signup';
    $('#auth').innerHTML = '<form class="card" id="af"><div style="font-family:Newsreader,serif;font-weight:600;font-size:28px">Evidix AI</div>' +
      '<h2>' + (su ? 'Create your account' : 'Welcome back') + '</h2>' +
      '<label class="f">Email<input type="email" id="ae" required autocomplete="email"></label>' +
      '<label class="f">Password<input type="password" id="ap" required minlength="8" autocomplete="' + (su ? 'new-password' : 'current-password') + '"></label>' +
      '<div class="msg ' + (ok ? 'ok' : 'err') + '" id="am" role="status">' + esc(msg || '') + '</div>' +
      (su ? '<p style="font-size:13px;margin:0;color:#4B5B78">By signing up you agree to our <a href="/terms.html" target="_blank" rel="noopener">Terms</a> and <a href="/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</p>' : '') +
      '<button class="btn" type="submit">' + (su ? 'Sign up' : 'Log in') + '</button>' +
      '<button class="btn ghost" type="button" id="as">' + (su ? 'I already have an account' : 'Create an account') + '</button>' +
      '<a href="/" style="text-align:center;font-size:14px">Back to evidixai.com</a></form>';
    $('#as').onclick = function () { mode = su ? 'login' : 'signup'; renderAuth(); };
    $('#af').onsubmit = function (e) {
      e.preventDefault();
      var em = $('#ae').value.trim(), pw = $('#ap').value;
      var p = su ? sb.auth.signUp({ email: em, password: pw, options: { emailRedirectTo: location.origin + '/app/' } }) : sb.auth.signInWithPassword({ email: em, password: pw });
      $('#am').textContent = 'One moment...'; $('#am').className = 'msg';
      p.then(function (r) {
        if (r.error) return renderAuth(r.error.message, false);
        if (su && !r.data.session) return renderAuth('Check your email to confirm your account, then log in.', true);
      });
    };
  }

  /* ---------- shell ---------- */
  var NAV = [['dashboard', 'Dashboard'], ['create', 'Create Video'], ['projects', 'My Projects'], ['library', 'Prompt Library'], ['characters', 'Saved Characters'], ['subscription', 'Subscription'], ['settings', 'Settings']];
  function renderSide() {
    var cur = (location.hash.replace(/^#\//, '').split(/[/?]/)[0]) || 'dashboard';
    var pct = me ? Math.min(100, Math.round(me.used / me.limit * 100)) : 0;
    $('#side').innerHTML = '<a class="logo" href="#/dashboard"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>Evidix AI</a>' +
      NAV.map(function (n) { return '<a class="nav' + (cur === n[0] || (cur === 'project' && n[0] === 'projects') ? ' on' : '') + '" href="#/' + n[0] + '">' + n[1] + '</a>'; }).join('') +
      (me ? '<div class="usage"><b>' + esc(me.planName) + ' plan</b><br>' + Math.max(0, me.limit - me.used) + ' of ' + me.limit + ' generations left<div class="bar"><i style="width:' + pct + '%"></i></div></div>' : '');
  }
  window.addEventListener('hashchange', function () { if (me) route(); });

  function route() {
    var h = location.hash.replace(/^#\//, '').split('?')[0].split('/');
    var v = h[0] || 'dashboard';
    renderSide();
    window.scrollTo(0, 0);
    if (v === 'dashboard') return viewDashboard();
    if (v === 'create') return viewCreate();
    if (v === 'projects') return viewProjects();
    if (v === 'project') return viewProject(h[1]);
    if (v === 'library') return viewLibrary();
    if (v === 'characters') return viewCharacters();
    if (v === 'subscription') return viewSub();
    if (v === 'settings') return viewSettings();
    location.hash = '#/dashboard';
  }

  /* ---------- generator form (used on dashboard and create) ---------- */
  function group(label, key, vals, fmt) {
    return '<div><div class="mono" style="margin-bottom:8px">' + label + '</div><div class="row" style="gap:8px">' + vals.map(function (v) {
      var locked = key === 'detail' && me && me.detail.indexOf(v) < 0;
      return '<button type="button" class="chip" data-k="' + key + '" data-v="' + esc(v) + '"' + (locked ? ' disabled title="Upgrade to unlock"' : '') + ' aria-pressed="' + (String(form[key]) === String(v) && !(key === 'duration' && form.custom)) + '">' + esc(fmt ? fmt(v) : v) + (locked ? ' 🔒' : '') + '</button>';
    }).join('') + '</div></div>';
  }
  function generatorHtml() {
    var left = me ? Math.max(0, me.limit - me.used) : 0;
    return '<div class="card" style="display:flex;flex-direction:column;gap:22px">' +
      '<textarea id="idea" maxlength="2000" placeholder="Describe your video idea... For example, a cinematic animated story about a college student who discovers an incredible business opportunity." aria-label="Video idea" style="font-size:17px;min-height:150px">' + esc(form.idea) + '</textarea>' +
      group('Video style', 'style', OPT.style) +
      '<div><div class="mono" style="margin-bottom:8px">Duration</div><div class="row" style="gap:8px">' + [10, 15, 30, 60].map(function (d) { return '<button type="button" class="chip" data-k="duration" data-v="' + d + '" aria-pressed="' + (!form.custom && form.duration === d) + '">' + d + ' seconds</button>'; }).join('') +
      '<button type="button" class="chip" id="cust" aria-pressed="' + form.custom + '">Custom</button>' + (form.custom ? '<input type="number" id="cdur" min="5" max="60" value="' + form.duration + '" style="width:110px" aria-label="Custom seconds"> <span class="mono">seconds (5-60)</span>' : '') + '</div></div>' +
      group('Aspect ratio', 'aspect', OPT.aspect) + group('Mood', 'mood', OPT.mood) + group('Audio preference', 'audio', OPT.audio) +
      '<div class="grid two"><div><div class="mono" style="margin-bottom:8px">Target video generator</div><div class="row"><button type="button" class="chip" aria-pressed="true">Higgsfield</button></div></div>' +
      group('Prompt detail', 'detail', OPT.detail, function (v) { return v[0].toUpperCase() + v.slice(1); }) + '</div>' +
      '<div class="note" style="font-size:13px">Reference image upload is not available yet. The plan will tell you which reference images would help.</div>' +
      '<div class="row"><button class="btn big" id="gen">Generate My Video Plan</button><span class="mono" id="gl">' + left + ' generation' + (left === 1 ? '' : 's') + ' left</span></div>' +
      '<div class="msg err" id="ge" role="alert"></div></div>';
  }
  function bindGenerator() {
    var ta = $('#idea');
    ta.oninput = function () { form.idea = ta.value; };
    document.querySelectorAll('.chip[data-k]').forEach(function (b) {
      b.onclick = function () { var k = b.dataset.k; form[k] = k === 'duration' ? +b.dataset.v : b.dataset.v; if (k === 'duration') form.custom = false; keepScroll(rerenderGen); };
    });
    var c = $('#cust'); if (c) c.onclick = function () { form.custom = true; keepScroll(rerenderGen); };
    var cd = $('#cdur'); if (cd) cd.oninput = function () { form.duration = parseInt(cd.value, 10) || 0; };
    $('#gen').onclick = generate;
  }
  var genHost = null;
  function rerenderGen() { genHost.innerHTML = generatorHtml(); bindGenerator(); }
  function keepScroll(fn) { var y = window.scrollY; fn(); window.scrollTo(0, y); }
  function mountGenerator(host) { genHost = host; rerenderGen(); }

  function generate() {
    var err = $('#ge'), btn = $('#gen');
    form.idea = $('#idea').value;
    if (form.idea.trim().length < 10) { err.textContent = 'Please describe your idea in a sentence or two (at least 10 characters).'; return; }
    if (form.duration < 5 || form.duration > 60) { err.textContent = 'Duration must be between 5 and 60 seconds.'; return; }
    err.textContent = ''; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Building your plan (this can take up to a minute)...';
    api('generate', { settings: { idea: form.idea.trim(), style: form.style, duration: form.duration, aspect: form.aspect, mood: form.mood, audio: form.audio, detail: form.detail, generator: 'Higgsfield' } })
      .then(function (r) { form.idea = ''; return refreshMe().then(function () { location.hash = '#/project/' + r.projectId; }); })
      .catch(function (e) { btn.disabled = false; btn.textContent = 'Generate My Video Plan'; err.textContent = e.message; if (e.status === 429) refreshMe(); });
  }

  /* ---------- views ---------- */
  function viewDashboard() {
    $('#main').innerHTML = '<div style="display:flex;flex-direction:column;gap:24px"><h1>What are we creating today?</h1><div id="gh"></div><div id="recent"></div></div>';
    mountGenerator($('#gh'));
    sb.from('projects').select('id,title,created_at,settings').order('created_at', { ascending: false }).limit(3).then(function (r) {
      if (!r.data || !r.data.length) return;
      $('#recent').innerHTML = '<h2 style="margin-bottom:12px">Recent projects</h2><div class="grid two">' + r.data.map(projCard).join('') + '</div>';
    });
  }
  function viewCreate() {
    $('#main').innerHTML = '<div style="display:flex;flex-direction:column;gap:24px"><h1>Create Video</h1><div id="gh"></div></div>';
    mountGenerator($('#gh'));
  }
  function projCard(p) {
    return '<a class="card" href="#/project/' + p.id + '" style="color:var(--ink);display:flex;flex-direction:column;gap:6px"><h3>' + esc(p.title) + '</h3><span class="mono">' + esc(p.settings.style) + ' · ' + p.settings.duration + 's · ' + esc(p.settings.aspect) + '</span><span style="font-size:13px;color:var(--muted)">' + new Date(p.created_at).toLocaleDateString() + '</span></a>';
  }
  function viewProjects() {
    $('#main').innerHTML = '<div style="display:flex;flex-direction:column;gap:20px"><h1>My Projects</h1><div id="pl">Loading...</div></div>';
    sb.from('projects').select('id,title,created_at,settings').order('created_at', { ascending: false }).then(function (r) {
      $('#pl').innerHTML = r.data && r.data.length ? '<div class="grid two">' + r.data.map(projCard).join('') + '</div>' : '<div class="card">No projects yet. <a href="#/create">Create your first video plan</a>.</div>';
    });
  }

  function copyBtn(text) {
    var b = document.createElement('button'); b.className = 'btn sm'; b.textContent = 'Copy Prompt';
    b.onclick = function () {
      var done = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy Prompt'; }, 1500); };
      try { navigator.clipboard.writeText(text).then(done, function () { b.textContent = 'Select and copy manually'; }); } catch (e) { b.textContent = 'Select and copy manually'; }
    };
    return b;
  }

  function viewProject(id) {
    $('#main').innerHTML = 'Loading...';
    sb.from('projects').select('*').eq('id', id).single().then(function (r) {
      if (r.error || !r.data) { $('#main').innerHTML = '<div class="card">Project not found. <a href="#/projects">Back to projects</a></div>'; return; }
      var p = r.data, pl = p.plan, s = p.settings;
      var h = '<div style="display:flex;flex-direction:column;gap:22px">' +
        '<div class="row" style="justify-content:space-between"><div><div class="mono">Saved project · ' + esc(s.style) + ' · ' + s.duration + 's · ' + esc(s.aspect) + ' · ' + esc(s.mood) + '</div><h1>' + esc(pl.title) + '</h1></div>' +
        '<div class="row"><button class="btn ghost sm" id="improve">Improve entire plan</button><button class="btn ghost sm" id="del">Delete</button></div></div>' +
        '<div class="msg err" id="pe" role="alert"></div>' +
        '<div class="card"><div class="mono" style="margin-bottom:8px">Project overview</div><p style="margin:0;font-size:17px">' + esc(pl.overview) + '</p><p style="margin:12px 0 0;font-size:13px;color:var(--muted)">Your idea: ' + esc(p.idea) + '</p></div>' +
        '<div><h2 style="margin-bottom:12px">Video prompts</h2><div id="parts" class="grid"></div><p style="font-size:13px;color:var(--muted)">Copy a prompt, then paste it into the video generator. Videos are generated on Higgsfield with your own account there. Evidix AI is not affiliated with Higgsfield.</p></div>' +
        '<div><h2 style="margin-bottom:12px">Storyboard</h2><div class="card" id="scenes"></div></div>' +
        '<div><h2 style="margin-bottom:12px">Characters</h2><div class="grid two">' + pl.characters.map(charCard).join('') + '</div></div>' +
        '<div><h2 style="margin-bottom:12px">Reference image guidance</h2><div class="card">' + (pl.referenceGuidance.length ? pl.referenceGuidance.map(function (g) { return '<div class="kv"><span class="mono">Scenes ' + esc(g.scenes) + '</span><span><b>' + esc(g.image) + '</b><br><span style="color:var(--muted)">' + esc(g.why) + '</span></span></div>'; }).join('') : 'No reference images are needed for this plan.') + '</div></div></div>';
      $('#main').innerHTML = h;
      pl.parts.forEach(function (x, i) {
        var d = document.createElement('div'); d.className = 'card';
        d.innerHTML = '<div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Part ' + (i + 1) + ' — ' + x.start + '–' + x.end + ' seconds</b><span class="row" id="pb' + i + '"></span></div><div class="prompt">' + esc(x.prompt) + '</div>';
        $('#parts').appendChild(d);
        var slot = d.querySelector('#pb' + i); slot.appendChild(copyBtn(x.prompt));
        var a = document.createElement('a'); a.className = 'btn ghost sm'; a.href = 'https://higgsfield.ai'; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open Higgsfield'; slot.appendChild(a);
      });
      $('#scenes').innerHTML = pl.scenes.map(function (sc, i) {
        return '<div class="scene"><div><div class="mono">' + sc.start + '–' + sc.end + 's</div><button class="btn ghost sm rg" data-i="' + i + '" style="margin-top:8px">Regenerate</button></div><div><div class="kv"><span class="mono">Action</span><span>' + esc(sc.action) + '</span></div>' + (sc.dialogue ? '<div class="kv"><span class="mono">Dialogue</span><span>' + esc(sc.dialogue) + '</span></div>' : '') + '<div class="kv"><span class="mono">Camera</span><span>' + esc(sc.camera) + '</span></div><div class="kv"><span class="mono">Lighting</span><span>' + esc(sc.lighting) + '</span></div></div></div>';
      }).join('');
      function regen(body, btn) {
        var pe = $('#pe'); pe.textContent = ''; btn.disabled = true; var old = btn.textContent; btn.textContent = 'Working...';
        api('generate', Object.assign({ projectId: id }, body)).then(function () { return refreshMe(); }).then(function () { viewProject(id); })
          .catch(function (e) { btn.disabled = false; btn.textContent = old; pe.textContent = e.message; });
      }
      $('#improve').onclick = function () { regen({}, this); };
      document.querySelectorAll('.rg').forEach(function (b) { b.onclick = function () { regen({ sceneIndexes: [+b.dataset.i] }, b); }; });
      $('#del').onclick = function () {
        var b = this; if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Click again to delete'; return; }
        sb.from('projects').delete().eq('id', id).then(function () { location.hash = '#/projects'; });
      };
    });
  }
  function charCard(c) {
    return '<div class="card"><h3>' + esc(c.name) + '</h3><div class="kv"><span class="mono">Look</span><span>' + esc(c.appearance) + '</span></div><div class="kv"><span class="mono">Clothing</span><span>' + esc(c.clothing) + '</span></div><div class="kv"><span class="mono">Personality</span><span>' + esc(c.personality) + '</span></div></div>';
  }
  function viewLibrary() {
    $('#main').innerHTML = '<div style="display:flex;flex-direction:column;gap:20px"><h1>Prompt Library</h1><div id="lib" class="grid">Loading...</div></div>';
    sb.from('projects').select('id,title,plan,created_at').order('created_at', { ascending: false }).then(function (r) {
      var host = $('#lib'); host.innerHTML = '';
      if (!r.data || !r.data.length) { host.innerHTML = '<div class="card">Your copy-ready prompts appear here after you create a project.</div>'; return; }
      r.data.forEach(function (p) { p.plan.parts.forEach(function (x, i) {
        var d = document.createElement('div'); d.className = 'card';
        d.innerHTML = '<div class="row" style="justify-content:space-between;margin-bottom:10px"><span><a href="#/project/' + p.id + '"><b>' + esc(p.title) + '</b></a> · Part ' + (i + 1) + ' (' + x.start + '–' + x.end + 's)</span><span class="row"></span></div><div class="prompt">' + esc(x.prompt) + '</div>';
        d.querySelector('.row .row').appendChild(copyBtn(x.prompt)); host.appendChild(d);
      }); });
    });
  }
  function viewCharacters() {
    $('#main').innerHTML = '<div style="display:flex;flex-direction:column;gap:20px"><h1>Saved Characters</h1><div id="ch" class="grid two">Loading...</div></div>';
    sb.from('projects').select('id,title,plan').order('created_at', { ascending: false }).then(function (r) {
      var out = [];
      (r.data || []).forEach(function (p) { p.plan.characters.forEach(function (c) { out.push(charCard(c).replace('</h3>', '</h3><div class="mono" style="margin:-4px 0 6px">from ' + esc(p.title) + '</div>')); }); });
      $('#ch').innerHTML = out.length ? out.join('') : '<div class="card">Characters from your projects appear here.</div>';
    });
  }
  function viewSub() {
    var ok = /checkout=success/.test(location.hash);
    var P = cfg.plans, order = ['free', 'creator', 'pro'];
    $('#main').innerHTML = '<div style="display:flex;flex-direction:column;gap:20px"><h1>Subscription</h1>' +
      (ok ? '<div class="note">Thanks! Your plan updates as soon as Stripe confirms the payment. Refresh in a moment if it still shows the old plan.</div>' : '') +
      '<div class="card"><div class="mono">Current plan</div><h2>' + esc(me.planName) + '</h2><p style="margin:6px 0 0">' + Math.max(0, me.limit - me.used) + ' of ' + me.limit + ' generations left' + (me.renews ? ' · renews ' + new Date(me.renews).toLocaleDateString() : '') + '</p>' +
      (me.hasBilling ? '<div class="row" style="margin-top:14px"><button class="btn ghost" id="portal">Manage or cancel subscription</button></div>' : '') + '</div>' +
      '<div class="msg err" id="se" role="alert"></div><div class="grid two">' + order.map(function (k) {
        var p = P[k], cur = me.plan === k;
        return '<div class="card" style="display:flex;flex-direction:column;gap:8px"><h3>' + esc(p.name) + '</h3><div style="font-size:30px;font-family:Newsreader,serif">$' + p.price + '<span style="font-size:14px;color:var(--muted)">/month</span></div><div style="color:var(--muted);font-size:14px">' + p.monthlyGenerations + ' project generations' + (k === 'free' ? ' in total' : ' monthly') + '</div>' +
          (k === 'free' ? '' : cur ? '<span class="mono">Your plan</span>' : (!p.purchasable ? '<span class="mono">Not available yet</span>' : me.plan !== 'free' ? '<span style="font-size:13px;color:var(--muted)">Use Manage subscription to switch.</span>' : '<button class="btn sub" data-p="' + k + '">Choose ' + esc(p.name) + '</button>')) + '</div>';
      }).join('') + '</div><p style="font-size:13px;color:var(--muted)">Plans cover planning and prompts only. They do not include Higgsfield video credits.</p></div>';
    document.querySelectorAll('.sub').forEach(function (b) { b.onclick = function () { b.disabled = true; api('checkout', { plan: b.dataset.p }).then(function (r) { location.href = r.url; }).catch(function (e) { b.disabled = false; $('#se').textContent = e.message; }); }; });
    var pb = $('#portal'); if (pb) pb.onclick = function () { api('portal', {}).then(function (r) { location.href = r.url; }).catch(function (e) { $('#se').textContent = e.message; }); };
  }
  function viewSettings() {
    $('#main').innerHTML = '<div style="display:flex;flex-direction:column;gap:20px;max-width:520px"><h1>Settings</h1><div class="card" style="display:flex;flex-direction:column;gap:14px"><div><div class="mono">Email</div>' + esc(me.email) + '</div>' +
      '<label class="f">New password<input type="password" id="np" minlength="8" autocomplete="new-password"></label><button class="btn ghost" id="cp">Change password</button><div class="msg" id="sm" role="status"></div></div><button class="btn ghost" id="lo">Log out</button></div>';
    $('#cp').onclick = function () { var v = $('#np').value; if (v.length < 8) { $('#sm').className = 'msg err'; $('#sm').textContent = 'Use at least 8 characters.'; return; } sb.auth.updateUser({ password: v }).then(function (r) { $('#sm').className = 'msg ' + (r.error ? 'err' : 'ok'); $('#sm').textContent = r.error ? r.error.message : 'Password updated.'; }); };
    $('#lo').onclick = function () { sb.auth.signOut(); };
  }
})();
</script>
</body>
</html>
