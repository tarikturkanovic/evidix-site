<style>
:root{--bg:#050913;--ink:#EFF5FF;--blue:#3B82F6;--blue-d:#93C5FD;--panel:#0A1224;--line:#1B2742;--line2:#2A4170;--muted:#9FB0CC;--ok:#4ADE80;--bad:#F87171}
*{box-sizing:border-box}
body{margin:0;background:#050913;color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5}
a{color:var(--blue-d);text-decoration:none}
button,input,textarea,select{font-family:inherit;font-size:15px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:'Space Grotesk','Inter',system-ui,sans-serif;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(30px,4vw,44px);line-height:1.1}h2{font-size:26px}h3{font-size:20px}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:8px;border:1px solid transparent;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#2563EB,#3B82F6 55%,#0EA5E9);color:#fff;box-shadow:0 10px 30px -12px rgba(59,130,246,.8),inset 0 1px 0 rgba(255,255,255,.22);transition:filter .2s}
.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--ink);border-color:var(--line2);box-shadow:none}.btn.ghost:hover{background:var(--panel)}
.btn.big{min-height:56px;font-size:17px;padding:0 32px}.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:16px;padding:22px}
.chip{min-height:40px;padding:0 16px;border:1px solid var(--line2);border-radius:999px;background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,#2563EB,#3B82F6);border-color:#60A5FA;color:#fff;box-shadow:0 8px 24px -10px rgba(59,130,246,.85)}.chip:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=email],input[type=password],input[type=number],textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:12px 14px;background:rgba(255,255,255,.04);color:var(--ink)}
textarea{resize:vertical;min-height:130px;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.msg{font-size:14px;min-height:20px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
/* shell */
#shell{display:flex;min-height:100vh}
#side{width:236px;flex:0 0 236px;background:rgba(8,14,28,.82);backdrop-filter:blur(12px);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
#side .logo{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk','Inter',system-ui,sans-serif;font-weight:600;font-size:24px;padding:0 8px 16px;color:var(--ink)}
#side a.nav{display:flex;align-items:center;min-height:42px;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:500}
#side a.nav:hover{background:var(--panel);color:var(--ink)}
#side a.nav.on{background:rgba(59,130,246,.18);box-shadow:inset 0 0 0 1px rgba(96,165,250,.35);color:var(--blue-d);font-weight:600}
#main{flex:1;min-width:0;padding:32px clamp(16px,4vw,48px) 64px;max-width:1100px}
.usage{margin-top:auto;font-size:13px;color:var(--muted);padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.bar{height:6px;background:rgba(59,130,246,.2);border-radius:3px;margin-top:8px}.bar i{display:block;height:6px;background:linear-gradient(90deg,#2563EB,#38BDF8);border-radius:3px}
@media(max-width:820px){#shell{flex-direction:column}#side{width:100%;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line);align-items:center}#side .logo{padding:0 8px;font-size:20px}#side a.nav{white-space:nowrap;flex:none}.usage{display:none}}
/* auth */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#auth .card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;padding:32px}
/* results */
.grid{display:grid;gap:16px}.two{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.scene{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.scene:first-child{border-top:0}
.kv{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:14px;padding:3px 0}
.prompt{background:#07101F;border:1px solid var(--line2);color:#E6F0FF;border-radius:10px;padding:16px;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.65;white-space:pre-wrap}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spin{width:18px;height:18px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;margin-right:10px}
@keyframes sp{to{transform:rotate(360deg)}}
.note{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);color:#FCD34D;border-radius:10px;padding:12px 14px;font-size:14px}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
:root{color-scheme:dark}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 600px at 10% -10%,rgba(37,99,235,.32),transparent 60%),radial-gradient(800px 600px at 95% 0%,rgba(14,165,233,.16),transparent 60%),radial-gradient(900px 700px at 50% 115%,rgba(59,130,246,.2),transparent 60%)}
#shell,#auth{position:relative;z-index:1}
h1{background:linear-gradient(180deg,#FFFFFF 25%,#93C5FD 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#auth .card{box-shadow:0 0 0 1px rgba(96,165,250,.25),0 40px 100px -30px rgba(59,130,246,.55)}
a.card{transition:transform .25s,box-shadow .25s,border-color .25s}
a.card:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 18px 40px -24px rgba(59,130,246,.6)}
::placeholder{color:#6F82A6}
@media (prefers-reduced-motion:reduce){a.card:hover{transform:none}}
</style>
</head>
<body>
<div id="boot" style="padding:40px;text-align:center;color:var(--muted)">Loading...</div>
<div id="auth" hidden></div>
<div id="shell" hidden>
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var sb, cfg, me = null, mode = 'login';
  var OPT = {
    style: ['3D Animation', 'Photorealistic', 'Anime', 'Cinematic', 'Product Commercial', 'UGC'],
    aspect: ['9:16', '16:9', '1:1'],
    mood: ['Suspenseful', 'Funny', 'Emotional', 'Inspirational', 'Dramatic', 'Luxury'],
    audio: ['Dialogue Only', 'Voiceover', 'No Dialogue', 'Dialogue With Music'],
    detail: ['standard', 'detailed', 'advanced']
  };
  var form = { idea: '', style: 'Cinematic', duration: 30, custom: false, aspect: '9:16', mood: 'Dramatic', audio: 'Dialogue With Music', detail: 'standard', generator: 'Higgsfield' };

  /* ---------- API ---------- */
  function token() { return sb.auth.getSession().then(function (r) { return r.data.session && r.data.session.access_token; }); }
  function api(path, body) {
    return token().then(function (t) {
      return fetch('/api/' + path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t }, body: body ? JSON.stringify(body) : undefined });
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Something went wrong.'); e.status = r.status; throw e; } return j; }); });
  }
  function refreshMe() { return api('me').then(function (m) { me = m; renderSide(); return m; }); }

  /* ---------- boot ---------- */
  fetch('/api/config').then(function (r) { return r.json(); }).then(function (c) {
    cfg = c;
    if (!c.supabaseUrl || !c.supabaseAnonKey) { $('#boot').textContent = 'The app is not configured yet (missing Supabase settings).'; return; }
    sb = window.supabase.createClient(c.supabaseUrl, c.supabaseAnonKey);
    sb.auth.onAuthStateChange(function () { start(); });
    start();
  }).catch(function () { $('#boot').textContent = 'Could not load the app. Please refresh.'; });

  var started = false;
  function start() {
    sb.auth.getSession().then(function (r) {
      $('#boot').hidden = true;
      if (!r.data.session) { me = null; $('#shell').hidden = true; $('#auth').hidden = false; renderAuth(); return; }
      $('#auth').hidden = true; $('#shell').hidden = false;
      refreshMe().then(route).catch(function (e) { $('#main').innerHTML = '<div class="note">' + esc(e.message) + '</div>'; });
    });
  }

  /* ---------- auth ---------- */
  function renderAuth(msg, ok) {
    var su = mode === 'signup';
    $('#auth').innerHTML = '<form class="card" id="af"><div style="font-family:Space Grotesk,Inter,sans-serif;font-weight:600;font-size:28px">Evidix AI</div>' +
      '<h2>' + (su ? 'Create your account' : 'Welcome back') + '</h2>' +
      '<label class="f">Email<input type="email" id="ae" required autocomplete="email"></label>' +
      '<label class="f">Password<input type="password" id="ap" required minlength="8" autocomplete="' + (su ? 'new-password' : 'current-password') + '"></label>' +
      '<div class="msg ' + (ok ? 'ok' : 'err') + '" id="am" role="status">' + esc(msg || '') + '</div>' +
      (su ? '<p style="font-size:13px;margin:0;color:var(--muted)">By signing up you agree to our <a href="/terms.html" target="_blank" rel="noopener">Terms</a> and <a href="/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</p>' : '') +
      '<button class="btn" type="submit">' + (su ? 'Sign up' : 'Log in') + '</button>' +
      '<button class="btn ghost" type="button" id="as">' + (su ? 'I already have an account' : 'Create an account') + '</button>' +
      '<a href="/" style="text-align:center;font-size:14px">Back to evidixai.com</a></form>';
    $('#as').onclick = function () { mode = su ? 'login' : 'signup'; renderAuth(); };
    $('#af').onsubmit = function (e) {
      e.preventDefault();
      var em = $('#ae').value.trim(), pw = $('#ap').value;
      var p = su ? sb.auth.signUp({ email: em, password: pw, options: { emailRedirectTo: location.origin + '/app/' } }) : sb.auth.signInWithPassword({ email: em, password: pw });
      $('#am').textContent = 'One moment...'; $('#am').className = 'msg';
      p.then(function (r) {
        if (r.error) return renderAuth(r.error.message, false);
        if (su && !r.data.session) return renderAuth('Check your email to confirm your account, then log in.', true);
      });
    };
  }

  /* ---------- shell ---------- */
  var NAV = [['dashboard', 'Dashboard'], ['create', 'Create Video'], ['projects', 'My Projects'], ['library', 'Prompt Library'], ['characters', 'Saved Characters'], ['subscription', 'Subscription'], ['settings', 'Settings']];
  function renderSide() {

    var pct = me ? Math.max(0, Math.min(100, Math.round((1 - me.credits / Math.max(1, me.creditsMax)) * 100))) : 0;

    var kids = Array.prototype.slice.call(root.children), rest = kids.slice(2), groups = { video: [], plan: [], story: [], chars: [] };
    rest.forEach(function (k) {
      var h = k.querySelector('h2'), name = h ? h.textContent : '';
      if (k.querySelector('#parts')) groups.video.push(k);
      else if (k.querySelector('#scenes')) groups.story.push(k);
      else if (name === 'Characters') groups.chars.push(k);
      else groups.plan.push(k);
    });
    var steps = document.createElement('div'); steps.className = 'card';
    steps.innerHTML = '<div style="font-weight:600;margin-bottom:8px">How to make your video</div><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)"><li>Each part below is one clip of up to 15 seconds. Pick 480p or 720p under a part and press <b>Render</b>. The credit cost is shown on the button.</li><li>Wait a few minutes. The video appears right under that part. You can leave the page and come back.</li><li>Download every part, then join them in any video editor (CapCut works well). Prefer another tool? Use <b>Copy Prompt</b> instead.</li></ol>';
    groups.video[0].parentNode.insertBefore(steps, groups.video[0]); groups.video.unshift(steps);
    var bar = document.createElement('div'); bar.className = 'row'; bar.style.cssText = 'gap:8px;flex-wrap:wrap';
    var tabs = [['video', 'Make video'], ['plan', 'Plan'], ['story', 'Storyboard'], ['chars', 'Characters']];
    function show(key) {
      tabs.forEach(function (tb) {
        groups[tb[0]].forEach(function (el) { el.style.display = tb[0] === key ? '' : 'none'; });
        bar.querySelector('[data-t="' + tb[0] + '"]').className = tb[0] === key ? 'btn sm' : 'btn ghost sm';
      });
    }
    tabs.forEach(function (tb) { var b = document.createElement('button'); b.type = 'button'; b.dataset.t = tb[0]; b.textContent = tb[1]; b.onclick = function () { show(tb[0]); }; bar.appendChild(b); });
    root.insertBefore(bar, rest[0]); show('video');
  }
  function viewProject(id) {
    $('#main').innerHTML = 'Loading...';
    sb.from('projects').select('*').eq('id', id).single().then(function (r) {
      if (r.error || !r.data) { $('#main').innerHTML = '<div class="card">Project not found. <a href="#/projects">Back to projects</a></div>'; return; }
      var p = r.data, pl = p.plan, s = p.settings;
      var h = '<div style="display:flex;flex-direction:column;gap:22px">' +
        '<div class="row" style="justify-content:space-between"><div><div class="mono">Saved project · ' + esc(s.style) + ' · ' + s.duration + 's · ' + esc(s.aspect) + ' · ' + esc(s.mood) + '</div><h1>' + esc(pl.title) + '</h1></div>' +
        '<div class="row"><button class="btn ghost sm" id="improve">Improve entire plan · 40 credits</button><button class="btn ghost sm" id="del">Delete</button></div></div>' +
        '<div class="msg err" id="pe" role="alert"></div>' +
        '<div class="card"><div class="mono" style="margin-bottom:8px">Project overview</div><p style="margin:0;font-size:17px">' + esc(pl.overview) + '</p><p style="margin:12px 0 0;font-size:13px;color:var(--muted)">Your idea: ' + esc(p.idea) + '</p></div>' +
        briefHtml(pl) +
        '<div><h2 style="margin-bottom:12px">Video prompts</h2><div id="parts" class="grid"></div><p style="font-size:13px;color:var(--muted)">Copy a prompt, then paste it into the video generator. Or render it here on a paid plan. Evidix AI is not affiliated with Higgsfield.</p></div>' +
        '<div><h2 style="margin-bottom:12px">Storyboard</h2><div class="card" id="scenes"></div></div>' +
        '<div><h2 style="margin-bottom:12px">Characters</h2><div class="grid two">' + pl.characters.map(charCard).join('') + '</div></div>' +
        '<div><h2 style="margin-bottom:12px">Reference image guidance</h2><div class="card">' + (pl.referenceGuidance.length ? pl.referenceGuidance.map(function (g) { return '<div class="kv"><span class="mono">Scenes ' + esc(g.scenes) + '</span><span><b>' + esc(g.image) + '</b><br><span style="color:var(--muted)">' + esc(g.why) + '</span></span></div>'; }).join('') : 'No reference images are needed for this plan.') + '</div></div></div>';
      $('#main').innerHTML = h;
      var rendersP = api('render?projectId=' + encodeURIComponent(id)).then(function (j) { return j.renders || []; }).catch(function () { return []; });
      pl.parts.forEach(function (x, i) {
        var d = document.createElement('div'); d.className = 'card';
        d.innerHTML = '<div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Part ' + (i + 1) + ' — ' + x.start + '–' + x.end + ' seconds</b><span class="row" id="pb' + i + '"></span></div><div class="mono" style="margin-bottom:8px">' + wc(x.prompt) + ' words</div><div class="prompt">' + esc(x.prompt) + '</div>' +
          '<details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600">Fix My Prompt</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px"><p style="margin:0;font-size:13px;color:var(--muted)">Tested this in Higgsfield and something went wrong? Describe what happened and we will rewrite this part. Costs 15 credits (returned if the fix fails).</p><textarea class="fxn" rows="3" maxlength="600" placeholder="e.g. The characters spoke gibberish, the laptop flipped around, it was too dark..." style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line,#ccc);background:transparent;color:inherit"></textarea><div class="row"><button class="btn sm fxb">Fix this prompt · 15 credits</button></div></div></details>' +
          (x.versions && x.versions.length ? '<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:var(--muted)">Previous versions (' + x.versions.length + ')</summary><div id="pv' + i + '" style="display:flex;flex-direction:column;gap:10px;margin-top:10px"></div></details>' : '');
        $('#parts').appendChild(d);
        renderBox(d, x, id, i, rendersP);
        (x.versions || []).slice().reverse().forEach(function (v) {
          var vd = document.createElement('div'); vd.className = 'card';
          vd.innerHTML = '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">Fix requested: ' + esc(v.note) + (v.changes ? '<br>' + esc(v.changes) : '') + '</div><div class="prompt">' + esc(v.prompt) + '</div><div class="row" style="margin-top:8px"></div>';
          vd.querySelector('.row').appendChild(copyBtn(v.prompt)); d.querySelector('#pv' + i).appendChild(vd);
        });
        d.querySelector('.fxb').onclick = function () {
          var b = this, note = d.querySelector('.fxn').value.trim();
          if (note.length < 5) { $('#pe').textContent = 'Describe the problem in a few words first.'; return; }
          regen({ fix: { part: i, note: note } }, b);
        };
        var slot = d.querySelector('#pb' + i); slot.appendChild(copyBtn(x.prompt));
        var a = document.createElement('a'); a.className = 'btn ghost sm'; a.href = 'https://higgsfield.ai'; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open Higgsfield'; slot.appendChild(a);
      });
      $('#scenes').innerHTML = pl.scenes.map(function (sc, i) {
        return '<div class="scene"><div><div class="mono">' + sc.start + '–' + sc.end + 's</div><button class="btn ghost sm rg" data-i="' + i + '" style="margin-top:8px">Regenerate · 15 credits</button></div><div><div class="kv"><span class="mono">Action</span><span>' + esc(sc.action) + '</span></div>' + (sc.dialogue ? '<div class="kv"><span class="mono">Dialogue</span><span>' + esc(sc.dialogue) + '</span></div>' : '') + '<div class="kv"><span class="mono">Camera</span><span>' + esc(sc.camera) + '</span></div><div class="kv"><span class="mono">Lighting</span><span>' + esc(sc.lighting) + '</span></div></div></div>';
      }).join('');
      function regen(body, btn) {
        var pe = $('#pe'); pe.textContent = ''; btn.disabled = true; var old = btn.textContent; btn.textContent = 'Working...';
        api('generate', Object.assign({ projectId: id }, body)).then(function () { return refreshMe(); }).then(function () { viewProject(id); })
          .catch(function (e) { btn.disabled = false; btn.textContent = old; pe.textContent = e.message; });
      }
      $('#improve').onclick = function () { regen({}, this); };
      projectTabs();
      document.querySelectorAll('.rg').forEach(function (b) { b.onclick = function () { regen({ sceneIndexes: [+b.dataset.i] }, b); }; });
      $('#del').onclick = function () {
        var b = this; if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Click again to delete'; return; }
        sb.from('projects').delete().eq('id', id).then(function () { location.hash = '#/projects'; });
      };
    });
  }
  function charCard(c) {
    return '<div class="card"><h3>' + esc(c.name) + '</h3><div class="kv"><span class="mono">Look</span><span>' + esc(c.appearance) + '</span></div><div class="kv"><span class="mono">Clothing</span><span>' + esc(c.clothing) + '</span></div><div class="kv"><span class="mono">Personality</span><span>' + esc(c.personality) + '</span></div>' + (c.voice ? '<div class="kv"><span class="mono">Voice</span><span>' + esc(c.voice) + '</span></div>' : '') + (c.performance ? '<div class="kv"><span class="mono">Performance</span><span>' + esc(c.performance) + '</span></div>' : '') + '</div>';
  }
  function viewLibrary() {
    $('#main').innerHTML = '<div style="display:flex;flex-direction:column;gap:20px"><h1>Prompt Library</h1><div id="lib" class="grid">Loading...</div></div>';
    sb.from('projects').select('id,title,plan,created_at').order('created_at', { ascending: false }).then(function (r) {
      var host = $('#lib'); host.innerHTML = '';
      if (!r.data || !r.data.length) { host.innerHTML = '<div class="card">Your copy-ready prompts appear here after you create a project.</div>'; return; }
      r.data.forEach(function (p) { p.plan.parts.forEach(function (x, i) {
        var d = document.createElement('div'); d.className = 'card';
        d.innerHTML = '<div class="row" style="justify-content:space-between;margin-bottom:10px"><span><a href="#/project/' + p.id + '"><b>' + esc(p.title) + '</b></a> · Part ' + (i + 1) + ' (' + x.start + '–' + x.end + 's)</span><span class="row"></span></div><div class="prompt">' + esc(x.prompt) + '</div>';
        d.querySelector('.row .row').appendChild(copyBtn(x.prompt)); host.appendChild(d);
      }); });
    });
  }
  function viewCharacters() {
    $('#main').innerHTML = '<div style="display:flex;flex-direction:column;gap:20px"><h1>Saved Characters</h1><div id="ch" class="grid two">Loading...</div></div>';
    sb.from('projects').select('id,title,plan').order('created_at', { ascending: false }).then(function (r) {
      var out = [];
      (r.data || []).forEach(function (p) { p.plan.characters.forEach(function (c) { out.push(charCard(c).replace('</h3>', '</h3><div class="mono" style="margin:-4px 0 6px">from ' + esc(p.title) + '</div>')); }); });
      $('#ch').innerHTML = out.length ? out.join('') : '<div class="card">Characters from your projects appear here.</div>';
    });
  }
  function viewSub() {
    var ok = /checkout=success/.test(location.hash), tk = /topup=success/.test(location.hash);
    var P = cfg.plans, T = cfg.topups || {}, order = ['creator', 'pro', 'studio'];
    var anyYear = order.some(function (k) { return P[k] && P[k].purchasable && P[k].purchasable.year; });
    var iv = anyYear ? 'year' : 'month';
    var active = me.status === 'active' || me.status === 'trialing';
    function fmt(n) { return Number(n).toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); }
    function draw() {
      var refresh = me.refreshes ? ' · refreshes ' + new Date(me.refreshes).toLocaleDateString() : '';
      $('#main').innerHTML = '<div style="display:flex;flex-direction:column;gap:20px"><h1>' + (GATE ? 'Pick a plan to start creating' : 'Subscription') + '</h1>' + (GATE ? '<p style="margin:0;color:var(--muted)">Evidix AI is a paid tool. Every plan includes credits for video plans, prompt fixes and in-site video rendering. Pick a plan and start right away. Cancel any time.</p>' : '') +
        (ok ? '<div class="note">Thanks! Your plan and credits update as soon as Stripe confirms the payment. Refresh in a moment if it still shows the old plan.</div>' : '') +
        (tk ? '<div class="note">Thanks! Your credits are added as soon as Stripe confirms the payment.</div>' : '') +
        '<div class="card"><div class="mono">Current plan</div><h2>' + esc(me.planName) + '</h2><p style="margin:6px 0 0">' + me.credits.toLocaleString() + ' of ' + me.creditsMax.toLocaleString() + ' credits left' + refresh + '</p>' +
        '<p style="margin:6px 0 0;font-size:13px;color:var(--muted)">New plan ' + me.costs.plan + ' credits · Fix My Prompt ' + me.costs.fix + ' · Regenerate a scene ' + me.costs.scene + ' · Improve plan ' + me.costs.improve + '. Unused credits expire when they refresh.</p>' +
        (me.hasBilling ? '<div class="row" style="margin-top:14px"><button class="btn ghost" id="portal">Manage or cancel subscription</button></div>' : '') + '</div>' +
        '<div class="msg err" id="se" role="alert"></div>' +
        (anyYear ? '<div class="row" style="gap:8px"><button class="btn ' + (iv === 'month' ? '' : 'ghost') + ' sm" id="ivm">Monthly</button><button class="btn ' + (iv === 'year' ? '' : 'ghost') + ' sm" id="ivy">Annual · save 20%</button></div>' : '') +
        '<div class="grid two">' + order.map(function (k) {
          var p = P[k], cur = me.plan === k, yr = iv === 'year';
          var price = k === 'free' ? 0 : (yr ? p.annualPrice / 12 : p.price);
          var can = p.purchasable && p.purchasable[iv];
          var bill = k === 'free' ? 'No card needed' : (yr ? 'Billed $' + fmt(p.annualPrice) + ' once a year' : 'Billed monthly, cancel any time');
          return '<div class="card" style="display:flex;flex-direction:column;gap:8px"><h3>' + esc(p.name) + '</h3><div style="font-size:30px;font-family:Space Grotesk,sans-serif">' + (k !== 'free' && yr ? '<span style="font-size:16px;color:var(--muted);text-decoration:line-through;margin-right:6px">$' + p.price + '</span>' : '') + '$' + fmt(price) + '<span style="font-size:14px;color:var(--muted)">' + (k === 'free' ? '' : '/month') + '</span></div><div style="color:var(--muted);font-size:13px">' + bill + '</div><div style="color:var(--muted);font-size:14px">' + p.credits.toLocaleString() + ' credits' + (k === 'free' ? ' in total' : ' every month') + '</div>' +
            (k === 'free' ? '' : cur ? '<span class="mono">Your plan</span>' : (!can ? '<span class="mono">Not available yet</span>' : active ? '<span style="font-size:13px;color:var(--muted)">Use Manage billing above to change plan.</span>' : '<button class="btn sub" data-p="' + k + '">Choose ' + esc(p.name) + '</button>')) + '</div>';
        }).join('') + '</div>' +
        (active ? '<div class="card"><h3>Need more credits?</h3><p style="margin:6px 0 12px;font-size:14px;color:var(--muted)">One-time top-ups for subscribers. They expire when your credits refresh.</p><div class="row" style="gap:10px;flex-wrap:wrap">' + Object.keys(T).map(function (k) {
          var x = T[k]; return x.purchasable ? '<button class="btn ghost tu" data-t="' + k + '">' + x.credits.toLocaleString() + ' credits · $' + x.price + '</button>' : '';
        }).join('') + '</div></div>' : '') +
        '<p style="font-size:13px;color:var(--muted)">Credits pay for video plans and prompt fixes. Video rendering uses the same credits (Seedance 2.5, paid plans). Prices shown before every action.</p></div>';
      document.querySelectorAll('.sub').forEach(function (bn) { bn.onclick = function () { bn.disabled = true; api('checkout', { plan: bn.dataset.p, interval: iv }).then(function (r) { location.href = r.url; }).catch(function (e) { bn.disabled = false; $('#se').textContent = e.message; }); }; });
      document.querySelectorAll('.tu').forEach(function (bn) { bn.onclick = function () { bn.disabled = true; api('checkout', { topup: bn.dataset.t }).then(function (r) { location.href = r.url; }).catch(function (e) { bn.disabled = false; $('#se').textContent = e.message; }); }; });
      var pb = $('#portal'); if (pb) pb.onclick = function () { api('portal', {}).then(function (r) { location.href = r.url; }).catch(function (e) { $('#se').textContent = e.message; }); };
      var m1 = $('#ivm'), y1 = $('#ivy'); if (m1) m1.onclick = function () { iv = 'month'; draw(); }; if (y1) y1.onclick = function () { iv = 'year'; draw(); };
    }
    draw();
  }
  function viewSettings() {
    $('#main').innerHTML = '<div style="display:flex;flex-direction:column;gap:20px;max-width:520px"><h1>Settings</h1><div class="card" style="display:flex;flex-direction:column;gap:14px"><div><div class="mono">Email</div>' + esc(me.email) + '</div>' +
      '<label class="f">New password<input type="password" id="np" minlength="8" autocomplete="new-password"></label><button class="btn ghost" id="cp">Change password</button><div class="msg" id="sm" role="status"></div></div><button class="btn ghost" id="lo">Log out</button></div>';
    $('#cp').onclick = function () { var v = $('#np').value; if (v.length < 8) { $('#sm').className = 'msg err'; $('#sm').textContent = 'Use at least 8 characters.'; return; } sb.auth.updateUser({ password: v }).then(function (r) { $('#sm').className = 'msg ' + (r.error ? 'err' : 'ok'); $('#sm').textContent = r.error ? r.error.message : 'Password updated.'; }); };
    $('#lo').onclick = function () { sb.auth.signOut(); };
  }
})();
</script>
</body>
</html>
